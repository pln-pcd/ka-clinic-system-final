<!DOCTYPE html>
<html lang="en" style="background-color: #F4F5F7;">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K&amp;A Clinic - Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      *, html, body, #root, button, input, select, textarea, div, span, p, a {
        font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      }
      html, body, #root {
        background-color: #F4F5F7 !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
    </style>
    <!-- The login backdrop's first slide is fetched while the document parses
         rather than after the app mounts, which is the difference between
         "already there" and "still loading" on a first visit. -->
    <link rel="preload" as="image" href="/assets/dashboard/login/1.jpg" fetchpriority="high" />
  </head>
  <body style="background-color: #F4F5F7;">
    <div id="root" style="background-color: #F4F5F7;"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
